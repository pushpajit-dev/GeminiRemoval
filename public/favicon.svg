<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="geminiStarGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="starCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#starCenterGlow)" filter="url(#starGlow)" opacity="0.5"/>

  <!-- Gemini 4-Point Star -->
  <path d="M32 4 C32 18, 38 26, 60 32 C38 38, 32 46, 32 60 C32 46, 26 38, 4 32 C26 26, 32 18, 32 4 Z" 
        fill="url(#geminiStarGrad)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5" 
        filter="url(#starGlow)"/>

  <!-- Center Spark Core -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" opacity="0.95"/>
</svg>